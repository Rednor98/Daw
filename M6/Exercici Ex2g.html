<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script>

        window.onload = function () {
            let resultat = document.getElementById("resultat");
            document.getElementById("Boton1").onclick = function () {
                let incremental = 0;
                let res = "";
                let num = 0;

                while (incremental != 25) {
                    num = num + 11;
                    res += num + "-"
                    incremental++;
                }
                resultat.innerHTML = res;
            }

            document.getElementById("Boton2").onclick = function () {
                let incremental = 1;
                let res = "";
                let ope = 0;

                while (incremental != 100) {
                    if (ope >= 500) {
                        break;
                    } else {
                        ope = 0;
                    }
                    ope = 8 * incremental;
                    res += ope + "-"
                    incremental++;
                }
                resultat.innerHTML = res;
            }
            document.getElementById("Boton3").onclick = function () {
                let incremental = 0;
                let media = 0;
                while (incremental >= 5) {
                    media += parseInt(prompt("Introduce una altura"));
                    incremental++;
                }

                media = media / incremental;

                resultat.innerHTML = media;
            }

        }

    </script>
</head>

<body>
    <input id="Boton1" type="button" value="Boton 1" />
    <input id="Boton2" type="button" value="Boton 2" />
    <input id="Boton3" type="button" value="Boton 3" />

    <div id="resultat"></div>
</body>

</html>
