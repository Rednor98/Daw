<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script>

        window.onload = function () {
            let resultat = document.getElementById("resultat");
            document.getElementById("Boton1").onclick = function () {
                let num1 = parseInt(prompt("Introduce un valor"));
                let num2 = parseInt(prompt("Introduce un valor"));
                let num3 = parseInt(prompt("Introduce un valor"));
                let res = 0;
                if (num1 == num2 && num1 == num3) {
                    res = (num1 + num2) * num3;
                    resultat.innerHTML = `El resultat es: ${res}`;
                } else {
                    resultat.innerHTML = "Els números no són iguals !!";
                }
            }
            document.getElementById("Boton2").onclick = function () {
                let num1 = parseInt(prompt("Introduce un valor"));
                let num2 = parseInt(prompt("Introduce un valor"));
                let num3 = parseInt(prompt("Introduce un valor"));
                
                if(num1 < 10 && num2 < 10 && num3 < 10 ){
                    resultat.innerHTML = "Tots el números són menors a deu";
                }
            }
            document.getElementById("Boton3").onclick = function(){
                let sou = parseFloat(prompt("Introdueix el teu sou"));
                let antiguitat = parseInt(prompt("Introdueix la teva antiguitat en la empresa"));

                if(sou < 1000 && antiguitat >= 10){
                    resultat.innerHTML = `El teu sou es: ${sou * 1.20}`;
                }else if(sou < 1000 && antiguitat < 10){
                     resultat.innerHTML = `El teu sou es: ${sou * 1.02}`;
                }else if(sou >= 1000){
                     resultat.innerHTML = `El teu sou es: ${sou}`;
                }
            }
            document.getElementById("Boton4").onclick = function(){
                let resp = prompt("Per fe el descompte al preu tens que ser sincer, ets (estudiant o menor)? ");

                if(resp !== "estudiant" && resp !== "menor"){
                    alert("Ten que especifica si (estudiant o menor)!!");
                    return;
                }

                if(resp == "estudiant"){
                    resultat.innerHTML = "No aplicar descompte";
                }else if(resp == "menor"){
                    resultat.innerHTML = "Aplicar descompte";
                }
            }
        }
    </script>
</head>

<body>
    <input id="Boton1" type="button" value="Boton 1" />
    <input id="Boton2" type="button" value="Boton 2" />
    <input id="Boton3" type="button" value="Boton 3" />
    <input id="Boton4" type="button" value="Boton 4" />

    <div id="resultat"></div>
</body>

</html>
